[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opsgraph"
version = "0.1.0b1"
description = "Self-hosted, policy-gated operational investigation workspace"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "python-dotenv>=1.1,<2",
  "pyyaml>=6,<7",
  "langgraph>=1.0,<2",
  "pglast>=7,<8",
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
providers = ["anthropic>=0.70,<1", "openai>=2,<3"]
dev = ["pytest>=8.4,<9", "httpx>=0.28,<1", "ruff>=0.12,<1"]

[project.scripts]
opsgraph = "opsgraph.cli:main"

[project.urls]
Homepage = "https://github.com/Arittra-Bag/opsgraph"
Repository = "https://github.com/Arittra-Bag/opsgraph"
Issues = "https://github.com/Arittra-Bag/opsgraph/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/opsgraph"]

[tool.hatch.build.targets.sdist]
# Rebuilding an extracted sdist must not include its old generated metadata twice.
# Documentation is opt-in; internal notes must never enter source archives.
exclude = ["/PKG-INFO", "/docs"]

[tool.hatch.build.targets.sdist.force-include]
"docs/connector-contract.md" = "docs/connector-contract.md"
"docs/installation.md" = "docs/installation.md"
"docs/maintenance.md" = "docs/maintenance.md"
"docs/migration.md" = "docs/migration.md"
"docs/product-charter.md" = "docs/product-charter.md"
"docs/quickstart.md" = "docs/quickstart.md"
"docs/release/beta-distribution.md" = "docs/release/beta-distribution.md"
"docs/release/build-and-dependencies.md" = "docs/release/build-and-dependencies.md"
"docs/release/notices/GPL-3.0.txt" = "docs/release/notices/GPL-3.0.txt"
"docs/release/notices/Kerberos-1.22.2-NOTICE.txt" = "docs/release/notices/Kerberos-1.22.2-NOTICE.txt"
"docs/release/notices/LGPL-3.0.txt" = "docs/release/notices/LGPL-3.0.txt"
"docs/release/notices/OpenLDAP-2.6.14-COPYRIGHT.txt" = "docs/release/notices/OpenLDAP-2.6.14-COPYRIGHT.txt"
"docs/release/notices/OpenLDAP-2.6.14-LICENSE.txt" = "docs/release/notices/OpenLDAP-2.6.14-LICENSE.txt"
"docs/release/notices/OpenSSL-3.5.8-ACKNOWLEDGEMENTS.md" = "docs/release/notices/OpenSSL-3.5.8-ACKNOWLEDGEMENTS.md"
"docs/release/notices/OpenSSL-3.5.8-AUTHORS.md" = "docs/release/notices/OpenSSL-3.5.8-AUTHORS.md"
"docs/release/notices/OpenSSL-3.5.8-LICENSE.txt" = "docs/release/notices/OpenSSL-3.5.8-LICENSE.txt"
"docs/release/notices/PostgreSQL-17.7-COPYRIGHT.txt" = "docs/release/notices/PostgreSQL-17.7-COPYRIGHT.txt"
"docs/release/notices/PostgreSQL-18.6-COPYRIGHT.txt" = "docs/release/notices/PostgreSQL-18.6-COPYRIGHT.txt"
"docs/release/notices/beta-native-provenance.json" = "docs/release/notices/beta-native-provenance.json"
"docs/release/notices/dependency-record-current.json" = "docs/release/notices/dependency-record-current.json"
"docs/release/notices/langsmith-0.11.0-LICENSE.txt" = "docs/release/notices/langsmith-0.11.0-LICENSE.txt"
"docs/release/notices/libpg_query-Bison-NOTICE.txt" = "docs/release/notices/libpg_query-Bison-NOTICE.txt"
"docs/release/notices/libpg_query-LICENSE.txt" = "docs/release/notices/libpg_query-LICENSE.txt"
"docs/release/notices/libpg_query-protobuf-c-NOTICE.txt" = "docs/release/notices/libpg_query-protobuf-c-NOTICE.txt"
"docs/release/notices/libpg_query-xxhash-NOTICE.txt" = "docs/release/notices/libpg_query-xxhash-NOTICE.txt"
"docs/release/notices/pglast-7.18-project-header.txt" = "docs/release/notices/pglast-7.18-project-header.txt"
"docs/release/notices/pglast-extracted-notices.json" = "docs/release/notices/pglast-extracted-notices.json"
