"docs/release/walkthrough.md" = "docs/release/walkthrough.md"
"docs/threat-model.md" = "docs/threat-model.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]
