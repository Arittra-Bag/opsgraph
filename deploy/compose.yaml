services:
  api:
    build:
      context: ..
      dockerfile: deploy/container/Dockerfile
    command: ["uvicorn", "opsgraph.api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      # Missing source/model reports unavailable, never replay.
      OPSGRAPH_MODE: ${OPSGRAPH_MODE:-connected}
      OPSGRAPH_EGRESS_ENABLED: ${OPSGRAPH_EGRESS_ENABLED:-false}
      OPSGRAPH_MODEL_PROVIDER: ${OPSGRAPH_MODEL_PROVIDER:-openai_compatible}
      OPSGRAPH_STATE_PATH: /data/state.db
      OPSGRAPH_API_KEY: ${OPSGRAPH_API_KEY:?Set OPSGRAPH_API_KEY before starting}
      OPSGRAPH_WORKSPACE_ID: ${OPSGRAPH_WORKSPACE_ID:-local-workspace}
      OPSGRAPH_POSTGRES_SECRET_REF: ${OPSGRAPH_POSTGRES_SECRET_REF:-OPSGRAPH_SOURCE_DSN}
      OPSGRAPH_ALLOWED_POSTGRES_SECRET_REFS: ${OPSGRAPH_ALLOWED_POSTGRES_SECRET_REFS:-OPSGRAPH_SOURCE_DSN}
      OPSGRAPH_POSTGRES_ALLOWED_SCHEMAS: ${OPSGRAPH_POSTGRES_ALLOWED_SCHEMAS:-public}
      OPSGRAPH_SOURCE_DSN: ${OPSGRAPH_SOURCE_DSN:-}
      # Host/container DNS is non-loopback and requires explicit deployment/source/playbook egress.
      OPSGRAPH_LOCAL_MODEL_URL: ${OPSGRAPH_LOCAL_MODEL_URL:?Set a container-reachable model URL explicitly}
      OPSGRAPH_LOCAL_MODEL: ${OPSGRAPH_LOCAL_MODEL:-qwen3:8b}
      OPSGRAPH_LOCAL_SCHEMA_PROFILE: ${OPSGRAPH_LOCAL_SCHEMA_PROFILE:-standard}
      # Pass through only when configured; omitted values do not become an invalid empty enum.
      OPSGRAPH_LOCAL_REASONING_EFFORT:
      OPSGRAPH_PROVIDER_TIMEOUT_SECONDS: ${OPSGRAPH_PROVIDER_TIMEOUT_SECONDS:-30}
      OPSGRAPH_OPENAI_API_KEY: ${OPSGRAPH_OPENAI_API_KEY:-}
      OPSGRAPH_ANTHROPIC_MODEL: ${OPSGRAPH_ANTHROPIC_MODEL:-claude-sonnet-5}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "127.0.0.1:8000:8000"
    extra_hosts:
      # Provides a host address on Linux; does not grant network access or egress permission.
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1770,uid=10001,gid=10001
    volumes:
      - opsgraph-state:/data
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    restart: unless-stopped
    networks: [control]

networks:
  # Connected mode needs an outbound path to the explicitly configured database
  # (and optionally a model provider). Application-level egress gates remain
  # fail-closed; deployers should additionally enforce host/network allowlists.
  control: {}

volumes:
  opsgraph-state:
