# The standalone browser preview is byte-for-byte identical to packaged assets.
# tests/unit/test_web_mirror.py enforces this contract on every CI run.
# Exclude only the redundant copy from duplication metrics; security and other
# analysis remain enabled for both copies and the canonical source stays counted.
sonar.cpd.exclusions=web/index.html,web/static/app.css,web/static/app.js,web/static/events.js,web/static/view-state.js,web/static/favicon.svg
